version: '3.8'

services:
  ois-app:
    build: .
    container_name: ois-container
    ports:
      - "8501:8501"
    restart: always
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    # Caso queira montar volumes para persistência de dados em desenvolvimento:
    # volumes:
    #   - ./data:/app/data
    #   - ./models:/app/models
